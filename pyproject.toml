[project]
name = "zyfenutri"
version = "1.9.1"
description = "Composition nutritionnelle du tempeh — le calcul, ses règles et ce qui les fonde"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
# La bibliothèque elle-même (`compute`) n'importe rien d'autre que la stdlib.
# PyYAML ne sert qu'à la ligne de commande, pour lire et écrire des documents
# YAML — du JSON passe sans lui.
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
zyfenutri = "zyfenutri.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zyfenutri"]

[tool.pytest.ini_options]
testpaths = ["tests"]
