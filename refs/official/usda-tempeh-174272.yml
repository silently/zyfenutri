notes: |
  - ⚠️ **Ni fibres ni sucres publiés.** On ne peut donc PAS départager glucides
    assimilables et fibres sur ce produit : seul leur total (7,64 g) est connu.
    C'est la limite principale de ce couple.
  - ⚠️ **Les AGS semblent faux** : 2,539 g pour 10,8 g de lipides, soit 23,5 %
    de saturés, alors que la graine en montre 14,5 % — l'huile de soja ne peut
    pas se saturer en fermentant. À l'échelle du lot, les AGS *augmenteraient*
    de 54 % pendant que les lipides baissent. Ne rien caler dessus.
  - Bouclage : 10,8 + 7,64 + 20,29 + 59,65 + 1,62 = 100,0 g ✅
