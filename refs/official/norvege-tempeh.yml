notes: |
  - Glucides assimilables cohérents avec leur détail : amidon 4,6 + sucres 0,9
    = 5,5 g. Les fibres sont donc bien exclues — convention INCO.
  - ⚠️ Amidon 4,6 g sur 5,5 g de glucides : l'essentiel des glucides restants
    est de l'amidon, et les sucres sont tombés à 0,9 g. C'est le comportement
    attendu — le mycélium consomme les sucres libres en premier.
  - Les cendres ne sont pas publiées.
