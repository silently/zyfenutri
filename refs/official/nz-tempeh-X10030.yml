notes: |
  - 🔑 **Le seul tempeh du lot qui publie tout** : fibres, sucres, amidon,
    cendres, et les glucides des deux façons. C'est le seul qui permette de
    suivre séparément fibres et glucides assimilables d'un bout à l'autre.
  - ⚠️ **L'amidon s'effondre** : 4,36 g dans la graine → 0,18 g dans le tempeh.
    Les sucres, eux, baissent moins (5,23 → 2,2). Et l'écart
    « par différence − pesés » tombe de 12,4 à 3,15 g : les oligosaccharides ont
    très largement disparu.
  - ⚠️ Les AGS suivent les lipides (16,2 % contre 12,4 % dans la graine), sans
    l'anomalie de la fiche USDA.
  - Bouclage : 9,78 + 5,53 + 7,7 + 18,9 + 56,2 + 1,9 = 100,0 g ✅
