notes: |
  - ⚠️ **L'eau à 20 g interroge.** Une graine de soja sèche en contient 8 à 11 g
    (8,54 chez l'USDA, 8,8 en Nouvelle-Zélande). À 20 g, et sans cendres
    publiées, le bouclage donne déjà 100,8 g — il ne reste rien pour les ~5 g de
    minéraux. Quelque chose ne va pas sur cette ligne : la traiter avec prudence.
  - Les cendres ne sont pas publiées : le bouclage n'est pas vérifiable.
  - ⚠️ Fibres à 16 g contre 9,3 chez l'USDA et en NZ : c'est la frontière
    fibres / glucides qui bouge, pas le produit (cf. le guide, chapitre
    « Valeurs nutritionnelles »). Glucides + fibres = 26,3 ici, 30,2 chez l'USDA.
