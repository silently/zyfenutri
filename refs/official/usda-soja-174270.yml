notes: |
  - ⚠️ « Carbohydrate, by difference » CONTIENT les fibres. Les glucides
    assimilables au sens INCO valent 30,16 − 9,3 = 20,86 g : c'est cette valeur
    qu'il faut déclarer, jamais celle publiée telle quelle.
  - L'amidon n'est pas publié. Le soja n'en contient presque pas, ce qui est le
    point important : ses glucides assimilables sont surtout des sucres et des
    oligosaccharides — solubles, donc lessivables et fermentescibles.
  - Bouclage : 19,94 + 20,86 + 9,3 + 36,49 + 8,54 + 4,87 = 100,0 g ✅
