# ══════════════════════════════════════════════════════════════════════════════
#  ⚠️  EXEMPLE PÉDAGOGIQUE — CE N'EST PAS UNE ANALYSE DE LABORATOIRE.
#
#  Aucun échantillon n'a été analysé ici. Ce fichier existe pour deux
#  raisons, et deux seulement :
#
#   1. montrer à quoi ressemble un fichier rempli ;
#   2. servir de test à `check.py` et à `tests/test_refs.py`.
#
#  Les valeurs « avant fermentation » sont d'ordre de grandeur (soja cuit) ;
#  les valeurs « après » ont été CALCULÉES en appliquant les coefficients
#  par défaut de `zyfenutri` (−60 % de glucides, −5 % de lipides, protéines et
#  fibres conservées). Le script doit donc retrouver exactement ces
#  coefficients — c'est ce qui prouve que la chaîne de vérification marche.
#
#  ⚠️ Ce bloc est RECALCULÉ à chaque changement des coefficients : il ne mesure
#  rien, il suit le modèle. Une vraie analyse, elle, ne bouge jamais — c'est
#  tout l'intérêt d'en avoir.
#
#  Ne vous en servez JAMAIS comme d'une référence : `exemple: true` l'exclut
#  des moyennes de calage.
# ══════════════════════════════════════════════════════════════════════════════

